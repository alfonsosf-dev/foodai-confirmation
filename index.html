<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmado - FoodAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: bounce 0.6s ease-out;
        }

        .success-icon::after {
            content: '✓';
            color: white;
            font-size: 40px;
            font-weight: bold;
        }

        @keyframes bounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .open-app-btn {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
            width: 100%;
        }

        .open-app-btn:hover {
            transform: translateY(-2px);
        }

        .fallback-text {
            color: #888;
            font-size: 14px;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon"></div>
        <h1 id="title">¡Email Confirmado!</h1>
        <p class="subtitle" id="subtitle">Tu cuenta ha sido verificada exitosamente. Ya puedes usar todas las funciones de FoodAI.</p>
        
        <button class="open-app-btn" id="open-btn" onclick="openApp()">
            Abrir FoodAI
        </button>
        
        <p class="fallback-text" id="fallback-text" style="display: none;">
            Si el botón no funciona, puedes abrir la app manualmente.
        </p>
    </div>

    <script>
        // Traducciones
        const translations = {
            es: {
                title: '¡Email Confirmado!',
                subtitle: 'Tu cuenta ha sido verificada exitosamente. Ya puedes usar todas las funciones de FoodAI.',
                button: 'Abrir FoodAI',
                fallback: 'Si el botón no funciona, puedes abrir la app manualmente.'
            },
            en: {
                title: 'Email Confirmed!',
                subtitle: 'Your account has been successfully verified. You can now use all FoodAI features.',
                button: 'Open FoodAI',
                fallback: 'If the button doesn\'t work, you can open the app manually.'
            },
            fr: {
                title: 'Email Confirmé!',
                subtitle: 'Votre compte a été vérifié avec succès. Vous pouvez maintenant utiliser toutes les fonctionnalités de FoodAI.',
                button: 'Ouvrir FoodAI',
                fallback: 'Si le bouton ne fonctionne pas, vous pouvez ouvrir l\'application manuellement.'
            }
        };

        // Detectar idioma de la URL o navegador
        function getLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            
            if (langParam && translations[langParam]) {
                return langParam;
            }
            
            // Detectar del navegador
            const browserLang = navigator.language.slice(0, 2);
            return translations[browserLang] ? browserLang : 'en';
        }

        // Aplicar traducciones
        function applyTranslations() {
            const lang = getLanguage();
            const t = translations[lang];
            
            document.getElementById('title').textContent = t.title;
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('open-btn').textContent = t.button;
            document.getElementById('fallback-text').textContent = t.fallback;
            document.documentElement.lang = lang;
            document.title = t.title + ' - FoodAI';
        }

        // Detectar tipo de dispositivo
        function detectDevice() {
            const userAgent = navigator.userAgent.toLowerCase();
            if (/android/.test(userAgent)) {
                return 'android';
            } else if (/iphone|ipad|ipod/.test(userAgent)) {
                return 'ios';
            } else {
                return 'desktop';
            }
        }

        // Intentar abrir la app
        function openApp() {
            const device = detectDevice();
            let deepLink = '';
            
            switch(device) {
                case 'android':
                    deepLink = 'foodai://email-confirmed';
                    break;
                case 'ios':
                    deepLink = 'foodai://email-confirmed';
                    break;
                default:
                    showDownloadLinks();
                    return;
            }

            window.location.href = deepLink;
            
            setTimeout(() => {
                showDownloadLinks();
            }, 2000);
        }

        // Mostrar mensaje alternativo
        function showDownloadLinks() {
            document.getElementById('fallback-text').style.display = 'block';
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            applyTranslations();
            
            const device = detectDevice();
            if (device === 'android' || device === 'ios') {
                setTimeout(openApp, 1000);
            } else {
                showDownloadLinks();
            }
        });
    </script>
</body>
</html>
